name: Feature request
description: Something Kirana should do that it doesn't.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work, with an example if you can.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you use instead now, in Kirana or elsewhere.
